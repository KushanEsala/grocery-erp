name: grocery-erp

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grocery_erp_api
    restart: unless-stopped
    environment:
      APP_NAME: "Grocery ERP"
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in the root .env file}
      APP_DEBUG: "false"
      APP_URL: ${PUBLIC_API_URL:-http://localhost:8009}
      APP_TIMEZONE: Asia/Colombo
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-grocery_erp}
      DB_USERNAME: ${DB_USERNAME:-grocery_erp_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      RUN_DATABASE_SEEDER: ${RUN_DATABASE_SEEDER:-false}
      ERP_DEMO_PASSWORD: ${ERP_DEMO_PASSWORD:-password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3002,127.0.0.1:3002}
    volumes:
      - api_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - erp_network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: grocery_erp_webserver
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_FORWARD_PORT:-8009}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8009}/api
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3002}
    container_name: grocery_erp_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8009}/api
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3002}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_FORWARD_PORT:-3002}:3000"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - erp_network

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: grocery_erp_phpmyadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PMA_HOST: ${DB_HOST:-host.docker.internal}
      PMA_PORT: ${DB_PORT:-3306}
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${DB_VIEWER_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  api_storage:
